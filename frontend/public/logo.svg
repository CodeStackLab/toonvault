<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="tv-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <linearGradient id="tv-grad-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="tv-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Container -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="#0F0D1E" />
  <rect x="32" y="32" width="448" height="448" rx="112" stroke="url(#tv-grad-primary)" stroke-width="8" stroke-opacity="0.4" />

  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="180" fill="url(#tv-grad-primary)" opacity="0.15" filter="url(#tv-glow)"/>

  <!-- Left Open Book Page -->
  <path d="M 128 176 C 180 156, 230 180, 256 196 V 364 C 230 348, 180 328, 128 348 Z" fill="url(#tv-grad-primary)"/>
  
  <!-- Right Open Book Page -->
  <path d="M 384 176 C 332 156, 282 180, 256 196 V 364 C 282 348, 332 328, 384 348 Z" fill="url(#tv-grad-primary)" opacity="0.85"/>

  <!-- Page Spine Divider -->
  <path d="M 256 190 V 368" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.6"/>

  <!-- Central Sparkle Star -->
  <path d="M 256 112 L 268 148 L 304 160 L 268 172 L 256 208 L 244 172 L 208 160 L 244 148 Z" fill="url(#tv-grad-glow)" filter="url(#tv-glow)"/>
  <path d="M 256 124 L 264 152 L 292 160 L 264 168 L 256 196 L 248 168 L 220 160 L 248 152 Z" fill="#FFFFFF"/>

  <!-- Floating Sparkles -->
  <circle cx="140" cy="140" r="10" fill="#06B6D4" opacity="0.8"/>
  <circle cx="370" cy="130" r="14" fill="#F43F5E" opacity="0.8"/>
</svg>
